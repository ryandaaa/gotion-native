name = "gotion-oauth"
main = "src/index.js"
compatibility_date = "2026-11-01"
account_id = "1c73f06b1e20ec6d3ed31016c7937acd"
routes = [{ pattern = "gotion.ryanda.my.id", custom_domain = true }]

# Where the website's download links find the releases.
[vars]
GITHUB_REPO = "ryandaaa/gotion-native"

# The webhook's verification token, the events kept per workspace, and
# which workspace a token belongs to (by its hash).
[[kv_namespaces]]
binding = "EVENTS"
id = "726f9b9ef3654dae8f44b37ab99e5841"

# The landing, privacy and terms pages: served as they are, before the
# Worker, which answers the paths no file has (/login, /callback, /refresh).
[assets]
directory = "./public"
html_handling = "drop-trailing-slash"

# Set the integration's credentials as secrets, not here:
#   npx wrangler secret put NOTION_CLIENT_ID
#   npx wrangler secret put NOTION_CLIENT_SECRET

# One Durable Object per workspace holds the apps' WebSockets and pushes them
# the workspace's events as the webhook gives them (GET /live).
[[durable_objects.bindings]]
name = "LIVE"
class_name = "Workspace"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Workspace"]
